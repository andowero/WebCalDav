services:
  app:
    build: .
    image: webcaldav:local
    ports:
      - "8000:8000"
    volumes:
      - data:/data
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/webcaldav.db
      LOG_LEVEL: INFO
      SESSION_IDLE_TIMEOUT: 3600
      # Reject CalDAV servers on private/LAN/loopback addresses (SSRF guard).
      # Set to "false" if your CalDAV server runs on a private/LAN IP.
      BLOCK_PRIVATE_CALDAV_URLS: "true"
      # Per-IP login throttle: at most ATTEMPTS per WINDOW seconds (0 disables).
      LOGIN_RATE_LIMIT_ATTEMPTS: 5
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: 300
      # Minimum length for passwords set on first login / password change.
      MIN_PASSWORD_LENGTH: 12
    restart: unless-stopped

volumes:
  data:
