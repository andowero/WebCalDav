services:
  app:
    build: .
    image: webcaldav:local
    ports:
      - "8000:8000"
    volumes:
      - data:/data
    env_file:
      - path: .env
        required: false
    environment:
      # Container DB lives on the mounted volume; override the .env default.
      DATABASE_URL: sqlite+aiosqlite:////data/webcaldav.db
    restart: unless-stopped

volumes:
  data:
