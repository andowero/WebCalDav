<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebCalDav</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <!-- luxon + plugin: required for named IANA timezones (e.g. Europe/Prague) -->
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.5.0/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/luxon3@6.1.15/index.global.min.js"></script>
  <link rel="stylesheet" href="/static/app.css?v={{ static_v }}">
</head>
<body>

<script>
  window.__STATE__ = {{ state | tojson }};
  window.__USER_EMAIL__ = {{ user_email | tojson }};
  window.__SETTINGS__ = { timezone: {{ tz | tojson }}, first_day_of_week: {{ fdow }}, time_format: {{ timefmt | tojson }}, date_format: {{ datefmt | tojson }} };
</script>

<!-- ── Login ── -->
<div id="page-login" class="auth-page" style="display:none">
  <div class="auth-card">
    <h1>WebCalDav</h1>
    <div id="login-error" class="error-msg" style="display:none"></div>
    <form id="login-form">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="username" required>
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</div>

<!-- ── Change password (first login) ── -->
<div id="page-change-pw" class="auth-page" style="display:none">
  <div class="auth-card">
    <h1>WebCalDav</h1>
    <p class="info-msg">First login — please set a new password before continuing.</p>
    <div id="cpw-error" class="error-msg" style="display:none"></div>
    <form id="change-pw-form">
      <label for="cpw-old">Current (one-off) password</label>
      <input id="cpw-old" type="password" autocomplete="current-password" required>
      <label for="cpw-new">New password</label>
      <input id="cpw-new" type="password" autocomplete="new-password" required minlength="10">
      <label for="cpw-confirm">Confirm new password</label>
      <input id="cpw-confirm" type="password" autocomplete="new-password" required minlength="10">
      <button type="submit">Set password</button>
    </form>
  </div>
</div>

<!-- ── Main calendar ── -->
<div id="page-calendar" style="display:none">
  <header class="top-bar">
    <span class="app-name">WebCalDav</span>
    <span class="user-email" id="header-email"></span>
    <button id="btn-settings" class="btn-outline">Settings</button>
    <button id="btn-logout" class="btn-outline">Log out</button>
  </header>
  <div class="calendar-body">
    <div id="calendar"></div>
  </div>
</div>

<!-- ── Event detail ── -->
<div id="event-overlay" class="event-overlay" style="display:none"></div>
<div id="event-modal" class="event-modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="ev-title-text">
  <div class="event-modal-header">
    <span id="ev-title-text">Event</span>
    <button id="btn-event-close" class="btn-icon" aria-label="Close">&#x2715;</button>
  </div>
  <div class="event-modal-body">
    <div id="ev-edit-note" class="info-msg" style="display:none"></div>
    <div id="ev-error" class="error-msg" style="display:none"></div>

    <label class="ev-field">
      <span class="ev-label">Name</span>
      <input id="ev-name" type="text">
    </label>

    <label class="ev-field" id="ev-calendar-field" style="display:none">
      <span class="ev-label">Calendar</span>
      <select id="ev-calendar"></select>
    </label>

    <fieldset class="ev-group">
      <legend>Duration</legend>
      <label class="ev-check"><input type="checkbox" id="ev-allday"> All day</label>
      <div class="ev-dt-row">
        <span class="ev-label">From</span>
        <span class="ev-date-fields" id="ev-start-date-fields"></span>
        <span class="ev-time ev-time-fields" id="ev-start-time-fields"></span>
      </div>
      <div class="ev-dt-row">
        <span class="ev-label">To</span>
        <span class="ev-date-fields" id="ev-end-date-fields"></span>
        <span class="ev-time ev-time-fields" id="ev-end-time-fields"></span>
      </div>
    </fieldset>

    <fieldset class="ev-group">
      <legend>Repetition</legend>
      <label class="ev-check"><input type="checkbox" id="ev-repeats"> Repeats</label>
      <div id="ev-repeat-details" class="ev-repeat-details" style="display:none">
        <div id="ev-recur-summary" class="ev-recur-summary" style="display:none"></div>
        <div id="ev-recur-editor" class="ev-recur-editor">
          <div class="ev-recur-row">
            <span class="ev-label">Every</span>
            <input id="ev-recur-interval" type="number" min="1" value="1" class="ev-recur-interval">
            <select id="ev-recur-freq">
              <option value="hourly">hour(s)</option>
              <option value="daily">day(s)</option>
              <option value="weekly">week(s)</option>
              <option value="monthly">month(s)</option>
              <option value="yearly">year(s)</option>
            </select>
          </div>
          <div class="ev-recur-row" id="ev-recur-monthly" style="display:none">
            <label class="ev-radio">
              <input type="radio" name="ev-monthly-mode" value="monthday" checked>
              On day <span id="ev-recur-monthday-desc"></span>
            </label>
            <label class="ev-radio">
              <input type="radio" name="ev-monthly-mode" value="weekday">
              On the <span id="ev-recur-weekday-desc"></span>
            </label>
          </div>
          <div class="ev-recur-row">
            <label class="ev-check">
              <input type="checkbox" id="ev-recur-end-date"> End by date
            </label>
            <span class="ev-date-fields" id="ev-recur-until-date-fields"></span>
          </div>
          <div class="ev-recur-row">
            <label class="ev-check">
              <input type="checkbox" id="ev-recur-end-count"> End after
            </label>
            <input id="ev-recur-count" type="number" min="1" value="10" class="ev-recur-count">
            <span class="ev-recur-unit">occurrence(s)</span>
          </div>
          <div id="ev-recur-preview" class="ev-recur-preview"></div>
        </div>
      </div>
    </fieldset>

    <label class="ev-field">
      <span class="ev-label">Location</span>
      <input id="ev-location" type="text" placeholder="—">
    </label>

    <label class="ev-field">
      <span class="ev-label">Notes</span>
      <textarea id="ev-notes" rows="3" placeholder="—"></textarea>
    </label>

    <div class="ev-field">
      <span class="ev-label">Reminders</span>
      <div id="ev-reminders" class="ev-reminders"></div>
    </div>
  </div>
  <div class="event-modal-footer">
    <button id="btn-event-delete" class="btn-danger" style="display:none">Delete</button>
    <button id="btn-event-cancel" class="btn-outline">Cancel</button>
    <button id="btn-event-save" class="btn-primary">Save</button>
  </div>
</div>

<!-- ── Event context menu (right-click) ── -->
<div id="ev-context-menu" class="ev-context-menu" style="display:none">
  <button type="button" id="ctx-edit">Edit</button>
  <button type="button" id="ctx-delete">Delete</button>
</div>

<!-- ── Confirm dialog ── -->
<div id="confirm-overlay" class="event-overlay" style="display:none"></div>
<div id="confirm-modal" class="confirm-modal" style="display:none" role="dialog" aria-modal="true">
  <p id="confirm-text"></p>
  <div class="confirm-footer">
    <button id="confirm-no" class="btn-outline">No</button>
    <button id="confirm-yes" class="btn-danger">Yes</button>
  </div>
</div>

<!-- ── Recurring scope chooser (delete / edit a series) ── -->
<div id="scope-overlay" class="event-overlay" style="display:none"></div>
<div id="scope-modal" class="confirm-modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="scope-title">
  <p id="scope-title"></p>
  <div class="scope-options">
    <button type="button" class="btn-outline" data-scope="all">All events in the series</button>
    <button type="button" class="btn-outline" data-scope="thisprev">This and all previous events</button>
    <button type="button" class="btn-outline" data-scope="this">This event only</button>
    <button type="button" class="btn-outline" data-scope="thisfuture">This and all future events</button>
  </div>
  <div class="confirm-footer">
    <button id="scope-cancel" class="btn-outline">Cancel</button>
  </div>
</div>

<!-- ── Settings panel ── -->
<div id="settings-overlay" class="settings-overlay" style="display:none"></div>
<aside id="settings-panel" class="settings-panel" style="display:none">
  <div class="settings-header">
    <span>Settings</span>
    <button id="btn-settings-close" class="btn-icon" aria-label="Close">&#x2715;</button>
  </div>

  <section class="settings-section">
    <h2>CalDAV Accounts</h2>
    <div id="accounts-list"></div>
    <details id="add-account-details">
      <summary>Add account</summary>
      <form id="add-account-form" class="inner-form">
        <div id="add-account-error" class="error-msg" style="display:none"></div>
        <label>Server URL</label>
        <input id="acc-url" type="url" placeholder="https://dav.example.com" required>
        <label>Username</label>
        <input id="acc-user" type="text" autocomplete="off" required>
        <label>Password</label>
        <input id="acc-pass" type="password" autocomplete="off" required>
        <button type="submit">Connect</button>
      </form>
    </details>
  </section>

  <section class="settings-section">
    <h2>Calendars</h2>
    <div id="calendars-list"></div>
  </section>

  <section class="settings-section">
    <h2>Preferences</h2>
    <form id="prefs-form" class="inner-form">
      <div id="prefs-msg" style="display:none"></div>
      <label>Timezone</label>
      <select id="pref-tz"></select>
      <label>First day of week</label>
      <select id="pref-fdow">
        <option value="0">Sunday</option>
        <option value="1">Monday</option>
        <option value="6">Saturday</option>
      </select>
      <label>Time format</label>
      <select id="pref-timefmt">
        <option value="24h">24-hour (13:00)</option>
        <option value="12h">12-hour (1pm)</option>
      </select>
      <label>Date format</label>
      <select id="pref-datefmt">
        <option value="YYYY-MM-DD">YYYY-MM-DD</option>
        <option value="MM/DD/YYYY">MM/DD/YYYY</option>
        <option value="DD/MM/YYYY">DD/MM/YYYY</option>
      </select>
      <button type="submit">Save</button>
    </form>
  </section>
</aside>

<script src="/static/app.js?v={{ static_v }}"></script>
</body>
</html>
