[project]
name = "webcaldav"
version = "0.1.0"
description = "Self-hosted CalDAV web UI"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "structlog>=26.1.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "caldav>=3.3.1",
    "python-dateutil>=2.9.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "typer>=0.27.2",
    "mcp>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "radicale>=3.8.0",
    "freezegun>=1.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["webcaldav/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in parameter defaults is the framework idiom.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Broad except-and-log at the CalDAV I/O boundary is deliberate: one bad
# calendar, item, or token must not take down a whole listing/request. Scoped
# to the files that actually talk to external services — a new blind except
# elsewhere still fails lint.
"webcaldav/caldav_client.py" = ["BLE001", "S110", "S112", "DTZ001"]
"webcaldav/mcp_server.py" = ["BLE001"]
"webcaldav/shares.py" = ["BLE001"]
"webcaldav/tokens.py" = ["BLE001"]
"webcaldav/routers/auth.py" = ["BLE001"]
"webcaldav/routers/caldav_accounts.py" = ["BLE001"]
"webcaldav/routers/events.py" = ["BLE001"]
"webcaldav/routers/journals.py" = ["BLE001"]
"webcaldav/routers/shares.py" = ["BLE001"]
"webcaldav/routers/tasks.py" = ["BLE001"]
"tests/test_caldav.py" = ["DTZ001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# Tests use pytest fixtures and fake clients that don't warrant full strict
# annotations; relax the untyped-def rules and skip checking their bodies.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

# caldav and icalendar ship py.typed markers but with incomplete/incorrect
# annotations (e.g. DAVClient/Calendar exported as `object`). Treat them as
# untyped instead of casting every call site.
[[tool.mypy.overrides]]
module = ["caldav", "caldav.*", "icalendar", "icalendar.*"]
follow_imports = "skip"
ignore_missing_imports = true
