[project]
name = "webcaldav"
version = "0.1.0"
description = "Self-hosted CalDAV web UI"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",
    "structlog>=24.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    "caldav>=1.3.0",
    "python-dateutil>=2.9.0",
    "prometheus-client>=0.21.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "typer>=0.13.0",
    "mcp>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "radicale>=3.4.0",
    "freezegun>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["webcaldav/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# Tests use pytest fixtures and fake clients that don't warrant full strict
# annotations; relax the untyped-def rules and skip checking their bodies.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

# caldav and icalendar ship py.typed markers but with incomplete/incorrect
# annotations (e.g. DAVClient/Calendar exported as `object`). Treat them as
# untyped instead of casting every call site.
[[tool.mypy.overrides]]
module = ["caldav", "caldav.*", "icalendar", "icalendar.*"]
follow_imports = "skip"
ignore_missing_imports = true
